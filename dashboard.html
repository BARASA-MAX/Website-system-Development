<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hospital Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Hospital Dashboard</a>
    </div>
  </nav>

  <!-- Dashboard Cards -->
  <div class="container mt-4">
    <div class="row g-4">
      <!-- Patients -->
      <div class="col-md-4">
        <div class="card shadow text-center">
          <div class="card-body">
            <h5 class="card-title">Patients</h5>
            <p class="card-text">Manage patient records</p>
            <a href="patients.html" class="btn btn-primary">Open</a>
          </div>
        </div>
      </div>
      <!-- Doctors -->
      <div class="col-md-4">
        <div class="card shadow text-center">
          <div class="card-body">
            <h5 class="card-title">Doctors</h5>
            <p class="card-text">Manage doctors & staff</p>
            <a href="doctors.html" class="btn btn-primary">Open</a>
          </div>
        </div>
      </div>
      <!-- Appointments -->
      <div class="col-md-4">
        <div class="card shadow text-center">
          <div class="card-body">
            <h5 class="card-title">Appointments</h5>
            <p class="card-text">Schedule & track visits</p>
            <a href="appointments.html" class="btn btn-primary">Open</a>
          </div>
        </div>
      </div>
      <!-- Billing -->
      <div class="col-md-6">
        <div class="card shadow text-center">
          <div class="card-body">
            <h5 class="card-title">Billing</h5>
            <p class="card-text">Invoices & payments</p>
            <a href="billing.html" class="btn btn-primary">Open</a>
          </div>
        </div>
      </div>
      <!-- Pharmacy -->
      <div class="col-md-6">
        <div class="card shadow text-center">
          <div class="card-body">
            <h5 class="card-title">Pharmacy</h5>
            <p class="card-text">Drug stock & prescriptions</p>
            <a href="pharmacy.html" class="btn btn-primary">Open</a>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
